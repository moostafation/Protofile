# Builds the ProtoCAD Viewer desktop program (cad-viewer/src-tauri) and its installers.
# Pushes that touch cad-viewer/ and manual runs upload the installers as workflow artifacts;
# a tag like v1.2.0 also creates a draft GitHub Release with them. Installers are unsigned.
name: Desktop app

on:
  push:
    branches: ['**']
    paths:
      - 'cad-viewer/**'
      - '.github/workflows/desktop.yml'
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            bundles: nsis,msi
            files: |
              cad-viewer/src-tauri/target/release/bundle/nsis/*.exe
              cad-viewer/src-tauri/target/release/bundle/msi/*.msi
          - name: Linux
            # The oldest supported Ubuntu, so the AppImage runs on more distributions.
            os: ubuntu-22.04
            bundles: deb,appimage
            files: |
              cad-viewer/src-tauri/target/release/bundle/deb/*.deb
              cad-viewer/src-tauri/target/release/bundle/appimage/*.AppImage
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: cad-viewer
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cad-viewer/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: cad-viewer/src-tauri -> target

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev patchelf file

      - run: npm ci

      - run: npm test

      - name: Check the Rust shell
        if: runner.os == 'Linux'
        working-directory: cad-viewer/src-tauri
        run: |
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked

      # Builds the web app (npm run build) and bundles it with the Rust shell.
      - name: Build installers
        run: npm run tauri build -- --bundles ${{ matrix.bundles }}

      - uses: actions/upload-artifact@v4
        with:
          name: ProtoCAD-Viewer-${{ matrix.name }}
          path: ${{ matrix.files }}
          if-no-files-found: error

  release:
    name: Draft release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true

      - name: Create or update the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          ls -l installers
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" installers/* --clobber
          else
            gh release create "$TAG" installers/* --draft --title "ProtoCAD Viewer $TAG" --generate-notes
          fi
