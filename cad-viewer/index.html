<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#14171c" />
  <meta name="description" content="ProtoCAD Viewer: view AutoCAD DWG/DXF, MicroStation DGN, HP-GL plot files, PDFs, images and 3D models (IFC, STEP, IGES, PCF piping, STL, OBJ, glTF, FBX), measure, print to PDF and ask an AI assistant about the drawing." />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <link rel="manifest" href="manifest.webmanifest" />
  <title>ProtoCAD Viewer</title>
</head>
<body>
  <div id="app">
    <header class="topbar">
      <div class="brand">
        <svg viewBox="0 0 32 32" aria-hidden="true"><rect x="3" y="3" width="26" height="26" rx="6" fill="#ff9f1c"/><path d="M9 22 L16 9 L23 22 Z" fill="none" stroke="#14171c" stroke-width="2.4" stroke-linejoin="round"/><circle cx="16" cy="18" r="2.4" fill="#14171c"/></svg>
        <span class="brand-name">ProtoCAD</span>
      </div>
      <button class="tb primary" data-action="open" data-i18n-title="open"><i data-icon="open"></i><span class="hide-sm" data-i18n="open"></span></button>
      <div class="tb-group" data-needs="doc">
        <button class="tb" data-action="extents" data-i18n-title="zoomExtents"><i data-icon="extents"></i></button>
        <button class="tb" data-action="zoomWindow" data-needs="cad sheet" data-i18n-title="zoomWindow"><i data-icon="zoomWindow"></i></button>
        <button class="tb hide-sm" data-action="zoomIn" data-i18n-title="zoomIn"><i data-icon="zoomIn"></i></button>
        <button class="tb hide-sm" data-action="zoomOut" data-i18n-title="zoomOut"><i data-icon="zoomOut"></i></button>
        <button class="tb" data-action="pan" data-tool="pan" data-i18n-title="panTool"><i data-icon="hand"></i></button>
      </div>
      <div class="tb-group" data-needs="doc">
        <button class="tb" data-action="select" data-tool="select" data-i18n-title="select"><i data-icon="select"></i></button>
        <div class="menu-wrap">
          <button class="tb" data-action="measureMenu" data-tool="measure" data-i18n-title="measure"><i data-icon="measure"></i><span class="hide-sm" data-i18n="measure"></span></button>
          <div class="menu" id="measureMenu" hidden>
            <button data-action="measure:dist"><i data-icon="ruler"></i><span data-i18n="measureDist"></span></button>
            <button data-action="measure:path" data-needs="cad sheet"><i data-icon="path"></i><span data-i18n="measurePath"></span></button>
            <button data-action="measure:area" data-needs="cad sheet"><i data-icon="area"></i><span data-i18n="measureArea"></span></button>
            <button data-action="measure:calibrate" data-needs="sheet"><i data-icon="calibrate"></i><span data-i18n="calibrate"></span></button>
            <hr />
            <label class="menu-check"><input type="checkbox" id="snapToggle" checked /><span data-i18n="snap"></span></label>
            <button data-action="measure:clear"><i data-icon="trash"></i><span data-i18n="measureClear"></span></button>
          </div>
        </div>
      </div>
      <div class="tb-group" data-needs="3d">
        <div class="menu-wrap">
          <button class="tb" data-action="viewsMenu" data-i18n-title="views3d"><i data-icon="cube"></i><span class="hide-sm" data-i18n="views"></span></button>
          <div class="menu" id="viewsMenu" hidden>
            <button data-action="view3d:iso"><i data-icon="cube"></i><span data-i18n="viewIso"></span></button>
            <button data-action="view3d:isoSW"><i data-icon="cube"></i><span data-i18n="viewIsoSW"></span></button>
            <button data-action="view3d:isoNE"><i data-icon="cube"></i><span data-i18n="viewIsoNE"></span></button>
            <button data-action="view3d:isoNW"><i data-icon="cube"></i><span data-i18n="viewIsoNW"></span></button>
            <hr />
            <button data-action="view3d:top"><i data-icon="viewTop"></i><span data-i18n="viewTop"></span></button>
            <button data-action="view3d:bottom"><i data-icon="viewTop"></i><span data-i18n="viewBottom"></span></button>
            <button data-action="view3d:front"><i data-icon="viewFront"></i><span data-i18n="viewFront"></span></button>
            <button data-action="view3d:back"><i data-icon="viewFront"></i><span data-i18n="viewBack"></span></button>
            <button data-action="view3d:left"><i data-icon="viewSide"></i><span data-i18n="viewLeft"></span></button>
            <button data-action="view3d:right"><i data-icon="viewSide"></i><span data-i18n="viewRight"></span></button>
            <hr />
            <button data-action="savePng"><i data-icon="download"></i><span data-i18n="savePng"></span></button>
          </div>
        </div>
        <button class="tb" data-action="proj3d" id="projBtn" data-i18n-title="projectionHint"><span class="tb-text" id="projLabel">PERSP</span></button>
        <button class="tb" data-action="section3d" data-i18n-title="sectionHint"><i data-icon="section"></i><span class="hide-sm" data-i18n="section"></span></button>
        <button class="tb" data-action="wire3d" id="wireBtn" data-i18n-title="wireframe"><i data-icon="wire"></i></button>
        <button class="tb" data-action="xray3d" id="xrayBtn" data-i18n-title="xray"><i data-icon="xray"></i></button>
      </div>
      <div class="tb-group" data-needs="cad">
        <button class="tb" data-action="toggleEditbar" id="editToggle" data-i18n-title="editTools"><i data-icon="edit"></i><span class="hide-sm" data-i18n="edit"></span></button>
      </div>
      <div class="spacer"></div>
      <div class="tb-group" data-needs="doc">
        <button class="tb" data-action="print" data-i18n-title="print"><i data-icon="print"></i><span class="hide-sm" data-i18n="print"></span></button>
        <button class="tb ai-btn" data-action="ai" data-i18n-title="ai"><i data-icon="sparkle"></i><span class="hide-sm" data-i18n="ai"></span></button>
      </div>
      <button class="tb" data-action="settings" data-i18n-title="settings"><i data-icon="settings"></i></button>
    </header>

    <div class="editbar" id="editbar" data-needs="cad" hidden>
      <div class="eb-group" role="toolbar" aria-label="Draw">
        <span class="eb-label" data-i18n="draw"></span>
        <button class="tb" data-action="cmd:line" data-tool="line" data-i18n-title="toolLine"><i data-icon="line"></i></button>
        <button class="tb" data-action="cmd:polyline" data-tool="polyline" data-i18n-title="toolPolyline"><i data-icon="polyline"></i></button>
        <button class="tb" data-action="cmd:rectangle" data-tool="rectangle" data-i18n-title="toolRectangle"><i data-icon="rect"></i></button>
        <button class="tb" data-action="cmd:circle" data-tool="circle" data-i18n-title="toolCircle"><i data-icon="circle"></i></button>
        <button class="tb" data-action="cmd:arc" data-tool="arc" data-i18n-title="toolArc"><i data-icon="arc"></i></button>
        <button class="tb" data-action="cmd:text" data-tool="text" data-i18n-title="toolText"><i data-icon="text"></i></button>
        <button class="tb" data-action="cmd:revcloud" data-tool="revcloud" data-i18n-title="toolRevcloud"><i data-icon="cloud"></i></button>
      </div>
      <div class="eb-group" role="toolbar" aria-label="Modify">
        <span class="eb-label" data-i18n="modify"></span>
        <button class="tb" data-action="cmd:move" data-tool="move" data-i18n-title="toolMove"><i data-icon="move"></i></button>
        <button class="tb" data-action="cmd:copy" data-tool="copy" data-i18n-title="toolCopy"><i data-icon="copy"></i></button>
        <button class="tb" data-action="cmd:rotate" data-tool="rotate" data-i18n-title="toolRotate"><i data-icon="rotate"></i></button>
        <button class="tb" data-action="cmd:scale" data-tool="scale" data-i18n-title="toolScale"><i data-icon="scale"></i></button>
        <button class="tb" data-action="cmd:mirror" data-tool="mirror" data-i18n-title="toolMirror"><i data-icon="mirror"></i></button>
        <button class="tb" data-action="cmd:offset" data-tool="offset" data-i18n-title="toolOffset"><i data-icon="offset"></i></button>
        <button class="tb" data-action="cmd:explode" data-tool="explode" data-i18n-title="toolExplode"><i data-icon="explode"></i></button>
        <button class="tb" data-action="cmd:erase" data-tool="erase" data-i18n-title="toolErase"><i data-icon="trash"></i></button>
      </div>
      <div class="eb-group">
        <button class="tb" data-action="undo" id="undoBtn" data-i18n-title="undo" disabled><i data-icon="undo"></i></button>
        <button class="tb" data-action="redo" id="redoBtn" data-i18n-title="redo" disabled><i data-icon="redo"></i></button>
      </div>
      <div class="eb-group">
        <button class="tb" data-action="save" id="saveBtn" data-i18n-title="saveDxf"><i data-icon="save"></i><span class="hide-sm" data-i18n="save"></span></button>
        <button class="tb" data-action="saveAs" data-i18n-title="saveAsDxf"><i data-icon="saveAs"></i></button>
      </div>
      <label class="eb-group eb-layer"><span class="eb-label" data-i18n="currentLayer"></span><select id="curLayer" data-i18n-title="currentLayerHint"></select></label>
    </div>

    <div class="workspace">
      <aside class="sidebar" id="sidebar" data-needs="doc">
        <nav class="tabs" id="sideTabs">
          <button data-tab="layers" data-i18n-title="layers" data-needs="cad"><i data-icon="layers"></i><span data-i18n="layers"></span></button>
          <button data-tab="blocks" data-i18n-title="blocks" data-needs="cad"><i data-icon="blocks"></i><span data-i18n="blocks"></span></button>
          <button data-tab="model" data-i18n-title="modelTreeHint" data-needs="3d"><i data-icon="tree"></i><span data-i18n="modelTree"></span></button>
          <button data-tab="bom" data-i18n-title="bomHint" data-needs="bom"><i data-icon="list"></i><span>BOM</span></button>
          <button data-tab="pages" data-i18n-title="pages" data-needs="sheet"><i data-icon="pages"></i><span data-i18n="pages"></span></button>
          <button data-tab="search" data-i18n-title="search"><i data-icon="search"></i><span data-i18n="search"></span></button>
          <button data-tab="info" data-i18n-title="info"><i data-icon="info"></i><span data-i18n="info"></span></button>
        </nav>
        <section class="tab-panel" data-panel="layers">
          <div class="panel-tools">
            <input type="search" id="layerFilter" dir="auto" data-i18n-placeholder="filter" />
            <button class="mini icon-mini" data-action="layerNew" data-i18n-title="newLayer"><i data-icon="plus"></i></button>
            <button class="mini" data-action="layersAll" data-i18n="showAll"></button>
            <button class="mini" data-action="layersNone" data-i18n="hideAll"></button>
          </div>
          <ul class="list" id="layerList"></ul>
          <div class="panel-foot"><button class="mini" data-action="layersCsv"><i data-icon="download"></i><span data-i18n="exportCsv"></span></button></div>
        </section>
        <section class="tab-panel" data-panel="blocks">
          <ul class="list" id="blockList"></ul>
          <div class="panel-foot"><button class="mini" data-action="bomCsv"><i data-icon="download"></i><span>BOM </span><span data-i18n="exportCsv"></span></button></div>
        </section>
        <section class="tab-panel" data-panel="model">
          <div class="panel-tools">
            <input type="search" id="treeFilter" dir="auto" data-i18n-placeholder="filter" />
            <button class="mini" data-action="treeAll" data-i18n="showAll"></button>
            <button class="mini" data-action="treeNone" data-i18n="hideAll"></button>
          </div>
          <ul class="list tree" id="modelTree"></ul>
        </section>
        <section class="tab-panel" data-panel="bom">
          <div class="panel-tools"><select id="bomFilter" data-i18n-title="bomFilter"></select></div>
          <div class="bom" id="bomTable"></div>
          <div class="panel-foot"><button class="mini" data-action="bom3dCsv"><i data-icon="download"></i><span data-i18n="exportCsv"></span></button></div>
        </section>
        <section class="tab-panel" data-panel="pages">
          <div class="thumbs" id="thumbs"></div>
        </section>
        <section class="tab-panel" data-panel="search">
          <div class="panel-tools"><input type="search" id="searchInput" dir="auto" data-i18n-placeholder="searchPlaceholder" /></div>
          <div class="muted small" id="searchCount"></div>
          <ul class="list" id="searchList"></ul>
        </section>
        <section class="tab-panel" data-panel="info">
          <dl class="props" id="infoList"></dl>
        </section>
      </aside>

      <main class="stage" id="stage">
        <div class="viewport" id="viewport"></div>
        <div class="viewport viewport3d" id="viewport3d" data-needs="3d"></div>
        <div class="float-panel" id="sectionPanel" hidden>
          <div class="fp-head"><span data-i18n="section"></span><button type="button" class="icon-btn" data-action="sectionClose" data-i18n-title="close"><i data-icon="close"></i></button></div>
          <div class="seg" role="group">
            <button type="button" data-sec="off" data-i18n="sectionOff"></button>
            <button type="button" data-sec="box" data-i18n="sectionBox"></button>
            <button type="button" data-sec="x" data-i18n-title="sectionPlaneX">X</button>
            <button type="button" data-sec="y" data-i18n-title="sectionPlaneY">Y</button>
            <button type="button" data-sec="z" data-i18n-title="sectionPlaneZ">Z</button>
          </div>
          <div id="secBox" class="sec-rows" hidden>
            <label><span>X</span><input type="range" id="secx0" min="0" max="1000" /><input type="range" id="secx1" min="0" max="1000" /></label>
            <label><span>Y</span><input type="range" id="secy0" min="0" max="1000" /><input type="range" id="secy1" min="0" max="1000" /></label>
            <label><span>Z</span><input type="range" id="secz0" min="0" max="1000" /><input type="range" id="secz1" min="0" max="1000" /></label>
          </div>
          <div id="secPlane" class="sec-rows" hidden>
            <label><span data-i18n="position"></span><input type="range" id="secPos" min="0" max="1000" /></label>
            <label class="check"><input type="checkbox" id="secFlip" /><span data-i18n="sectionFlip"></span></label>
          </div>
          <button type="button" class="mini" data-action="sel3d:section" data-i18n="sectionAround"></button>
        </div>
        <div class="welcome" id="welcome">
          <div class="welcome-card">
            <svg class="welcome-logo" viewBox="0 0 32 32" aria-hidden="true"><rect x="3" y="3" width="26" height="26" rx="6" fill="#ff9f1c"/><path d="M9 22 L16 9 L23 22 Z" fill="none" stroke="#14171c" stroke-width="2.4" stroke-linejoin="round"/><circle cx="16" cy="18" r="2.4" fill="#14171c"/></svg>
            <h1>ProtoCAD Viewer</h1>
            <p class="lead" data-i18n="tagline"></p>
            <p data-i18n="openHint"></p>
            <div class="welcome-actions">
              <button class="btn primary" data-action="open"><i data-icon="open"></i><span data-i18n="open"></span></button>
              <button class="btn" data-action="sample"><i data-icon="blocks"></i><span data-i18n="sample"></span></button>
              <button class="btn" data-action="sample3d"><i data-icon="cube"></i><span data-i18n="sample3d"></span></button>
            </div>
            <div class="recent" id="recentFiles" hidden>
              <div class="recent-head"><span data-i18n="recentFiles"></span><button type="button" class="mini" id="recentClear" data-i18n="clearRecent"></button></div>
              <ul class="recent-list" id="recentList"></ul>
            </div>
            <p class="muted small" id="formatsText"></p>
            <p class="muted small" data-i18n="privacy"></p>
          </div>
        </div>
        <div class="drop-hint" id="dropHint"><span data-i18n="dropHere"></span></div>
        <div class="loading" id="loading" hidden><div class="spinner"></div><span id="loadingText"></span></div>
        <div class="toast" id="toast" hidden></div>
        <div class="cmdbar" id="cmdbar" hidden>
          <label for="cmdInput" id="cmdPrompt"></label>
          <input id="cmdInput" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" dir="ltr" enterkeyhint="go" />
        </div>
        <div class="bottom-bar" data-needs="doc">
          <div class="space-tabs" id="spaceTabs"></div>
          <div class="status" id="status"></div>
          <span class="sel-count" id="selCount" hidden></span>
          <button type="button" class="stat-btn" id="snapBtn" data-needs="cad" data-i18n-title="snapHint">SNAP</button>
          <button type="button" class="stat-btn" id="orthoBtn" data-needs="cad" data-i18n-title="orthoHint">ORTHO</button>
        </div>
        <button class="fab sidebar-toggle" data-action="toggleSidebar" data-needs="doc"><i data-icon="layers"></i></button>
        <button class="fab props-fab" id="propsFab" data-action="showProps" hidden><i data-icon="info"></i><span data-i18n="properties"></span></button>
      </main>

      <aside class="rightbar" id="rightbar" hidden>
        <div class="right-head">
          <nav class="tabs" id="rightTabs">
            <button data-rtab="props"><i data-icon="info"></i><span data-i18n="properties"></span></button>
            <button data-rtab="ai"><i data-icon="sparkle"></i><span data-i18n="ai"></span></button>
          </nav>
          <button class="icon-btn" data-action="closeRight" data-i18n-title="close"><i data-icon="close"></i></button>
        </div>
        <section class="rpanel" data-rpanel="props">
          <dl class="props" id="propList"></dl>
        </section>
        <section class="rpanel ai" data-rpanel="ai">
          <div class="ai-log" id="aiLog"></div>
          <div class="ai-quick" id="aiQuick"></div>
          <form class="ai-form" id="aiForm">
            <textarea id="aiInput" rows="2" dir="auto" data-i18n-placeholder="aiPlaceholder"></textarea>
            <div class="ai-row">
              <label class="check"><input type="checkbox" id="aiView" checked /><span data-i18n="aiIncludeView"></span></label>
              <span class="spacer"></span>
              <button type="button" class="mini" data-action="aiNew" data-i18n="aiNew"></button>
              <button type="submit" class="btn primary small" id="aiSend"><span data-i18n="aiSend"></span></button>
            </div>
          </form>
        </section>
      </aside>
    </div>
  </div>

  <dialog id="printDialog" class="dialog wide">
    <form method="dialog" class="dialog-body">
      <h2 data-i18n="printTitle"></h2>
      <div class="print-grid">
        <div class="print-options" id="printOptions">
          <label><span data-i18n="paper"></span><select id="pPaper"></select></label>
          <label><span data-i18n="orientation"></span>
            <select id="pOrient"><option value="auto" data-i18n="auto"></option><option value="landscape" data-i18n="landscape"></option><option value="portrait" data-i18n="portrait"></option></select></label>
          <label data-print="area"><span data-i18n="plotArea"></span>
            <select id="pArea"><option value="extents" data-i18n="areaExtents"></option><option value="view" data-i18n="areaView"></option><option value="window" data-i18n="areaWindow"></option></select></label>
          <label data-print="pages"><span data-i18n="pages"></span>
            <select id="pPages"><option value="current" data-i18n="pagesCurrent"></option><option value="all" data-i18n="pagesAll"></option></select></label>
          <label data-print="cad"><span data-i18n="scaleLabel"></span>
            <select id="pScale"></select></label>
          <label data-print="cad"><span data-i18n="colorMode"></span>
            <select id="pColor"><option value="mono" data-i18n="colorMono"></option><option value="color" data-i18n="colorColor"></option><option value="gray" data-i18n="colorGray"></option></select></label>
          <label class="check" data-print="cad"><input type="checkbox" id="pLw" checked /><span data-i18n="plotLineweights"></span></label>
          <label class="check"><input type="checkbox" id="pStamp" checked /><span data-i18n="stamp"></span></label>
        </div>
        <div class="print-preview"><canvas id="pPreview"></canvas><div class="muted small" id="pInfo"></div></div>
      </div>
      <div class="pdf-print" id="pdfPrint" hidden><p data-i18n="pdfPrintHint"></p></div>
      <p class="muted small" id="pDesktopHint" data-i18n="printDesktopHint" hidden></p>
      <div class="dialog-actions">
        <button value="cancel" class="btn" data-i18n="cancel"></button>
        <span class="spacer"></span>
        <button type="button" class="btn" id="pPng" data-print="3d" hidden><i data-icon="download"></i><span data-i18n="savePng"></span></button>
        <button type="button" class="btn" id="pDownload"><i data-icon="download"></i><span data-i18n="downloadPdf"></span></button>
        <button type="button" class="btn primary" id="pPrint"><i data-icon="print"></i><span data-i18n="printNow"></span></button>
      </div>
    </form>
  </dialog>

  <dialog id="calibrateDialog" class="dialog">
    <form method="dialog" class="dialog-body">
      <h2 data-i18n="calibrate"></h2>
      <p class="muted small" id="calInfo"></p>
      <div class="cal-row">
        <label><span data-i18n="realDistance"></span><input type="number" id="calValue" min="0.000001" step="any" required inputmode="decimal" /></label>
        <label><span data-i18n="units"></span>
          <select id="calUnit"><option value="mm">mm</option><option value="cm">cm</option><option value="m">m</option><option value="in">in</option><option value="ft">ft</option></select></label>
      </div>
      <div class="dialog-actions">
        <button type="button" class="btn" data-action="cancelDialog" data-i18n="cancel"></button>
        <span class="spacer"></span>
        <button value="ok" class="btn primary" data-i18n="apply"></button>
      </div>
    </form>
  </dialog>

  <dialog id="unsupportedDialog" class="dialog">
    <form method="dialog" class="dialog-body">
      <h2 id="unsupportedTitle"></h2>
      <p id="unsupportedText" class="unsupported-text"></p>
      <p class="muted small" data-i18n="unsupportedMore"></p>
      <div class="dialog-actions">
        <span class="spacer"></span>
        <button value="ok" class="btn primary" data-i18n="ok"></button>
      </div>
    </form>
  </dialog>

  <dialog id="settingsDialog" class="dialog">
    <form method="dialog" class="dialog-body">
      <h2 data-i18n="settings"></h2>
      <label><span data-i18n="theme"></span>
        <select id="sTheme"><option value="dark" data-i18n="themeDark"></option><option value="light" data-i18n="themeLight"></option><option value="mono" data-i18n="themeMono"></option></select></label>
      <label class="check"><input type="checkbox" id="sLw" /><span data-i18n="lineweights"></span></label>
      <hr />
      <h3><i data-icon="sparkle"></i> <span data-i18n="aiTitle"></span></h3>
      <label><span data-i18n="apiKey"></span><input type="password" id="sKey" autocomplete="off" placeholder="sk-ant-…" dir="ltr" /></label>
      <p class="muted small" data-i18n="apiKeyHint"></p>
      <label><span data-i18n="aiModel"></span>
        <select id="sModel" dir="ltr">
          <option value="claude-opus-5-5">Claude Opus 5.5</option>
          <option value="claude-sonnet-5-5">Claude Sonnet 5.5</option>
          <option value="claude-fable-5-1">Claude Fable 5.1</option>
        </select></label>
      <label><span data-i18n="aiEffort"></span>
        <select id="sEffort"><option value="low" data-i18n="effortLow"></option><option value="medium" data-i18n="effortMedium"></option><option value="high" data-i18n="effortHigh"></option></select></label>
      <div class="dialog-actions">
        <button type="button" class="btn" data-action="cancelDialog" data-i18n="cancel"></button>
        <span class="spacer"></span>
        <button value="save" class="btn primary" id="sSave" data-i18n="save"></button>
      </div>
    </form>
  </dialog>

  <dialog id="unsavedDialog" class="dialog">
    <form method="dialog" class="dialog-body">
      <h2 data-i18n="unsavedTitle"></h2>
      <p id="unsavedText"></p>
      <div class="dialog-actions">
        <button value="cancel" class="btn" data-i18n="cancel"></button>
        <span class="spacer"></span>
        <button value="discard" class="btn" data-i18n="dontSave"></button>
        <button value="save" class="btn primary" data-i18n="save"></button>
      </div>
    </form>
  </dialog>

  <dialog id="formatsDialog" class="dialog">
    <form method="dialog" class="dialog-body">
      <h2 data-i18n="formatsTitle"></h2>
      <dl class="props formats" id="formatsList"></dl>
      <div class="dialog-actions">
        <span class="spacer"></span>
        <button value="ok" class="btn primary" data-i18n="ok"></button>
      </div>
    </form>
  </dialog>

  <div class="menu" id="layerMenu" hidden></div>
  <!-- accept is filled from the format registry at start-up; several files: a 3D model with its MTL, .bin or textures -->
  <input type="file" id="fileInput" multiple hidden />
  <script type="module" src="/src/main.js"></script>
</body>
</html>
